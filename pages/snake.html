<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  body { font-family: sans-serif; text-align: center; background: #111; color: #eee; }
  canvas { background: #222; border: 2px solid #4caf50; display: block; margin: 10px auto; }
  button { font-size: 16px; padding: 6px 14px; margin: 4px; cursor: pointer; }
  .pad button { width: 52px; }
</style>
</head>
<body>
<h1>🐍 Snake</h1>
<p>Score: <span id="score">0</span> &nbsp;|&nbsp; Use arrow keys or the buttons below</p>
<canvas id="game" width="400" height="400"></canvas>
<button onclick="start()">Restart</button>
<div class="pad">
  <div><button onclick="turn(0,-1)">↑</button></div>
  <div>
    <button onclick="turn(-1,0)">←</button>
    <button onclick="turn(0,1)">↓</button>
    <button onclick="turn(1,0)">→</button>
  </div>
</div>
<script>
  const cv = document.getElementById('game'), ctx = cv.getContext('2d');
  const CELL = 20, COLS = 20, ROWS = 20; // grid size in cells
  let snake, dir, food, score, timer;

  function placeFood() {
    // Pick a random cell not occupied by the snake
    do {
      food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#ff5252'; // food
    ctx.fillRect(food.x * CELL, food.y * CELL, CELL, CELL);
    ctx.fillStyle = '#4caf50'; // snake
    snake.forEach(s => ctx.fillRect(s.x * CELL, s.y * CELL, CELL - 1, CELL - 1));
  }

  function step() {
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    // Game over on wall hit or self collision
    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      clearInterval(timer);
      alert('Game over! Score: ' + score);
      return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      document.getElementById('score').textContent = score;
      placeFood();
    } else {
      snake.pop(); // move forward without growing
    }
    draw();
  }

  function turn(x, y) {
    // Prevent reversing straight into the snake
    if (dir.x === -x && dir.y === -y) return;
    dir = { x, y };
  }

  function start() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    score = 0;
    document.getElementById('score').textContent = score;
    placeFood();
    draw();
    clearInterval(timer);
    timer = setInterval(step, 130);
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp') turn(0, -1);
    if (e.key === 'ArrowDown') turn(0, 1);
    if (e.key === 'ArrowLeft') turn(-1, 0);
    if (e.key === 'ArrowRight') turn(1, 0);
  });

  start();
</script>
</body>
</html>
