<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Preview</title>
<style>
  /* Simple split-view layout */
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f5; }
  h1 { text-align: center; font-size: 1.4rem; margin: 12px 0; }
  .wrap { display: flex; gap: 12px; padding: 0 16px 16px; height: calc(100vh - 80px); }
  textarea, .preview {
    flex: 1; border: 1px solid #ccc; border-radius: 8px;
    padding: 12px; background: #fff; overflow: auto;
  }
  textarea { font-family: monospace; font-size: 14px; resize: none; }
  .preview h1, .preview h2, .preview h3 { margin: 0.4em 0; }
  .preview code { background: #eee; padding: 2px 5px; border-radius: 4px; }
  .preview pre { background: #222; color: #eee; padding: 10px; border-radius: 6px; overflow: auto; }
  .preview pre code { background: none; color: inherit; padding: 0; }
  .preview blockquote { border-left: 4px solid #999; margin: 8px 0; padding: 4px 12px; color: #555; }
</style>
</head>
<body>
<h1>Markdown Preview</h1>
<div class="wrap">
  <textarea id="src" placeholder="Type markdown here..."># Hello!
Type **bold**, *italic*, `code`, or a [link](https://example.com).

- list item one
- list item two

> A wise quote.

```
print("code block")
```</textarea>
  <div class="preview" id="out"></div>
</div>
<script>
// Tiny markdown subset: headings, bold, italic, code, links, lists, quotes, fenced blocks.
function render(md) {
  const esc = md.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  // Fenced code blocks first
  let html = esc.replace(/```([\s\S]*?)```/g, (m, c) => "<pre><code>" + c.trim() + "</code></pre>");
  // Headings
  html = html.replace(/^### (.*)$/gm, "<h3>$1</h3>")
             .replace(/^## (.*)$/gm, "<h2>$1</h2>")
             .replace(/^# (.*)$/gm, "<h1>$1</h1>");
  // Bold, italic, inline code, links
  html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
             .replace(/\*(.+?)\*/g, "<em>$1</em>")
             .replace(/`([^`]+)`/g, "<code>$1</code>")
             .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
  // Bullet lists: consecutive "- " lines
  html = html.replace(/((?:^|\n)(?:- .*(?:\n|$))+)/g, (m) => {
    const items = m.trim().split("\n").map(l => "<li>" + l.replace(/^- /, "") + "</li>").join("");
    return "<ul>" + items + "</ul>";
  });
  // Blockquotes
  html = html.replace(/^&gt; (.*)$/gm, "<blockquote>$1</blockquote>");
  // Paragraphs for leftover plain lines
  html = html.split(/\n{2,}/).map(p => /^</.test(p.trim()) ? p : "<p>" + p + "</p>").join("\n");
  return html;
}
const src = document.getElementById("src"), out = document.getElementById("out");
function update() { out.innerHTML = render(src.value); }
src.addEventListener("input", update);
update(); // initial render
</script>
</body>
</html>
