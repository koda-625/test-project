<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typing Speed Test</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3em auto; padding: 0 1em; text-align: center; background: #f7f7f9; color: #222; }
  #quote { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 1.2em; font-size: 1.15em; line-height: 1.7; text-align: left; user-select: none; }
  .typed-correct { color: #1a7f37; }
  .typed-wrong { color: #d1242f; background: #ffdada; }
  #stats { font-size: 1.6em; margin: 1em 0; }
  textarea { width: 100%; height: 5em; font-size: 1.1em; border-radius: 8px; border: 1px solid #ccc; padding: .6em; resize: none; }
  button { font-size: 1em; padding: .5em 1.4em; margin: .4em; border-radius: 8px; border: none; background: #2f6fed; color: #fff; cursor: pointer; }
  button:hover { background: #1f55c4; }
</style>
</head>
<body>
<h1>⌨️ Typing Speed Test</h1>
<p>Type the sentence below as fast as you can. Timing starts on your first keystroke.</p>
<div id="quote"></div>
<p><textarea id="input" placeholder="Start typing here..." disabled></textarea></p>
<div id="stats">WPM: — &nbsp;|&nbsp; Accuracy: —</div>
<p><button id="restart">New quote</button></p>

<script>
// Random pangrams and proverbs to keep every round fresh.
const QUOTES = [
  "The quick brown fox jumps over the lazy dog.",
  "Pack my box with five dozen liquor jugs.",
  "Actions speak louder than words, so type quietly but fast.",
  "A journey of a thousand miles begins with a single keystroke.",
  "How vexingly quick daft zebras jump across the meadow.",
  "The five boxing wizards jump quickly over the fence.",
  "Curiosity killed the cat, but speed fed the typist.",
  "Practice makes perfect, and perfect typing beats deadlines.",
  "Waltz, bad nymph, for quick jigs vex every onlooker.",
  "Better late than never, but faster than ever beats both."
];

const quoteEl = document.getElementById("quote");
const inputEl = document.getElementById("input");
const statsEl = document.getElementById("stats");
const restartBtn = document.getElementById("restart");

let target = "", startTime = 0, finished = false;

function pickQuote() {
  return QUOTES[Math.floor(Math.random() * QUOTES.length)];
}

function newRound() {
  target = pickQuote();
  startTime = 0;
  finished = false;
  inputEl.value = "";
  inputEl.disabled = false;
  inputEl.focus();
  quoteEl.innerHTML = target.split("").map(c =>
    `<span data-ch="${c === " " ? "space" : c}">${c === " " ? "&nbsp;" : c}</span>`).join("");
  statsEl.innerHTML = "WPM: — &nbsp;|&nbsp; Accuracy: —";
}

function onInput() {
  if (finished) return;
  if (!startTime) startTime = Date.now();
  const typed = inputEl.value;
  const spans = quoteEl.children;
  let wrong = 0;
  for (let i = 0; i < spans.length; i++) {
    const el = spans[i];
    if (i < typed.length) {
      const ok = typed[i] === target[i];
      el.className = ok ? "typed-correct" : "typed-wrong";
      if (!ok) wrong++;
    } else {
      el.className = "";
    }
  }
  const minutes = (Date.now() - startTime) / 60000;
  const words = typed.length / 5;
  const wpm = minutes > 0 ? Math.round(words / minutes) : 0;
  const acc = typed.length ? Math.round((typed.length - wrong) / typed.length * 100) : 100;
  statsEl.innerHTML = `WPM: <b>${wpm}</b> &nbsp;|&nbsp; Accuracy: <b>${acc}%</b>`;
  if (typed.length >= target.length) {
    finished = true;
    inputEl.disabled = true;
    statsEl.innerHTML += wrong === 0 ? " 🎉 Perfect run!" : " 🏁 Done!";
  }
}

inputEl.addEventListener("input", onInput);
restartBtn.addEventListener("click", newRound);
newRound();
</script>
</body>
</html>
