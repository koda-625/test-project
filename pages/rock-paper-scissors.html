<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Paper Scissors</title>
<style>
  body { font-family: system-ui, sans-serif; text-align: center; background: #1a1a2e; color: #eee; margin-top: 60px; }
  button { font-size: 1.4rem; margin: 8px; padding: 14px 22px; border-radius: 12px; border: none; cursor: pointer; background: #e94560; color: white; }
  button:hover { background: #c73650; }
  #result { font-size: 1.3rem; margin-top: 20px; min-height: 2em; }
  #score { margin-top: 10px; color: #aaa; }
</style>
</head>
<body>
<h1>✊ ✋ ✌️ Rock Paper Scissors</h1>
<!-- Buttons let the player pick; JS picks a random computer move and decides the winner. -->
<button onclick="play('rock')">✊ Rock</button>
<button onclick="play('paper')">✋ Paper</button>
<button onclick="play('scissors')">✌️ Scissors</button>
<div id="result"></div>
<div id="score">You 0 : 0 Computer</div>
<script>
let you = 0, cpu = 0;
const beats = { rock: 'scissors', paper: 'rock', scissors: 'paper' };
const names = { rock: '✊', paper: '✋', scissors: '✌️' };
function play(user) {
  const choices = ['rock', 'paper', 'scissors'];
  const comp = choices[Math.floor(Math.random() * 3)];
  let msg;
  if (user === comp) { msg = "It's a tie!"; }
  else if (beats[user] === comp) { msg = `You win! ${names[user]} beats ${names[comp]}`; you++; }
  else { msg = `You lose! ${names[comp]} beats ${names[user]}`; cpu++; }
  document.getElementById('result').textContent = `You: ${names[user]}  Computer: ${names[comp]} — ${msg}`;
  document.getElementById('score').textContent = `You ${you} : ${cpu} Computer`;
}
</script>
</body>
</html>
