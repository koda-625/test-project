<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Balls</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #111; color: #eee;
         text-align: center; overflow: hidden; }
  h1 { margin: 12px 0 4px; font-size: 1.4em; }
  p { margin: 0 0 8px; color: #aaa; font-size: 0.9em; }
  canvas { display: block; margin: 0 auto; background: #1a1a2e;
           border: 1px solid #333; cursor: crosshair; }
  button { margin-top: 10px; padding: 8px 18px; font-size: 1em;
           border: none; border-radius: 6px; background: #e94560;
           color: #fff; cursor: pointer; }
  button:hover { background: #ff5c73; }
</style>
</head>
<body>
<h1>🎱 Gravity Balls</h1>
<p>Click anywhere to drop a ball. Watch it bounce!</p>
<canvas id="c" width="640" height="420"></canvas><br>
<button onclick="balls.length = 0">Clear all</button>

<script>
// Simple gravity playground: click to spawn a bouncing ball.
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const GRAVITY = 0.35;   // downward acceleration per frame
const BOUNCE = 0.75;    // energy kept after each bounce
const balls = [];

function randomColor() {
  // Pick a bright, cheerful hue.
  return `hsl(${Math.floor(Math.random() * 360)}, 80%, 60%)`;
}

function spawn(x, y) {
  balls.push({
    x, y,
    vx: (Math.random() - 0.5) * 6,  // small random sideways kick
    vy: 0,
    r: 8 + Math.random() * 18,      // radius 8–26 px
    color: randomColor()
  });
}

canvas.addEventListener('pointerdown', (e) => {
  const rect = canvas.getBoundingClientRect();
  spawn(e.clientX - rect.left, e.clientY - rect.top);
});

function tick() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const b of balls) {
    b.vy += GRAVITY;          // gravity pulls the ball down
    b.x += b.vx;
    b.y += b.vy;
    // Bounce off the floor and walls, losing a bit of energy each time.
    if (b.y + b.r > canvas.height) { b.y = canvas.height - b.r; b.vy *= -BOUNCE; }
    if (b.x - b.r < 0) { b.x = b.r; b.vx = Math.abs(b.vx) * BOUNCE; }
    if (b.x + b.r > canvas.width) { b.x = canvas.width - b.r; b.vx = -Math.abs(b.vx) * BOUNCE; }
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = b.color;
    ctx.fill();
  }
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
