<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Mixer</title>
<style>
  body { font-family: sans-serif; text-align: center; background: #111; color: #eee; }
  .mix { display: flex; justify-content: center; gap: 1.5rem; margin: 1rem; }
  .swatch { width: 120px; height: 120px; border-radius: 12px; border: 2px solid #555; }
  input[type=color] { width: 64px; height: 40px; cursor: pointer; }
  input[type=range] { width: 300px; }
  #result { font-size: 1.2rem; margin-top: 0.5rem; }
</style>
</head>
<body>
  <h1>🎨 Color Mixer</h1>
  <p>Pick two colors, drag the ratio, get the blend.</p>
  <div class="mix">
    <div><div class="swatch" id="a"></div><br><input type="color" id="ca" value="#ff0000"></div>
    <div><div class="swatch" id="b"></div><br><input type="color" id="cb" value="#0000ff"></div>
    <div><div class="swatch" id="c"></div><br>blend</div>
  </div>
  <input type="range" id="ratio" min="0" max="100" value="50">
  <div id="result"></div>
  <script>
    const $ = id => document.getElementById(id);
    // Mix two hex colors at ratio t (0 = all a, 1 = all b)
    function mix(hexA, hexB, t) {
      const p = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
      const [r1,g1,b1] = p(hexA), [r2,g2,b2] = p(hexB);
      const c = v => Math.round(v).toString(16).padStart(2,'0');
      return '#' + c(r1+(r2-r1)*t) + c(g1+(g2-g1)*t) + c(b1+(b2-b1)*t);
    }
    function update() {
      const t = $('ratio').value / 100;
      $('a').style.background = $('ca').value;
      $('b').style.background = $('cb').value;
      const m = mix($('ca').value, $('cb').value, t);
      $('c').style.background = m;
      $('result').textContent = `Ratio ${t.toFixed(2)} → ${m.toUpperCase()}`;
    }
    ['ca','cb','ratio'].forEach(id => $(id).addEventListener('input', update));
    update();
  </script>
</body>
</html>
