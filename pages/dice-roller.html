<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dice Roller</title>
<style>
  body { font-family: sans-serif; text-align: center; padding: 3rem; background: #1e293b; color: #f1f5f9; }
  #dice { font-size: 8rem; margin: 1rem; transition: transform .15s; }
  #dice.rolling { transform: rotate(360deg) scale(1.3); }
  button { font-size: 1.2rem; padding: .6rem 2rem; border-radius: .5rem; border: none;
           background: #38bdf8; color: #0f172a; cursor: pointer; }
  button:hover { background: #7dd3fc; }
  #total { font-size: 1.5rem; margin-top: 1rem; }
  #history { margin-top: 1.5rem; color: #94a3b8; }
</style>
</head>
<body>
<h1>🎲 Dice Roller</h1>
<div id="dice">⚀</div>
<button onclick="roll()">Roll the dice</button>
<div id="total"></div>
<div id="history"></div>

<script>
// Unicode dice faces ⚀–⚅ map 1:1 to roll values
const faces = ["⚀","⚁","⚂","⚃","⚄","⚅"];
let rolls = 0, total = 0;
const diceEl = document.getElementById("dice");

function roll() {
  diceEl.classList.add("rolling");
  // fake tumble for 300ms, then land on the final value
  const tumble = setInterval(() => {
    diceEl.textContent = faces[Math.floor(Math.random() * 6)];
  }, 60);
  setTimeout(() => {
    clearInterval(tumble);
    const value = Math.floor(Math.random() * 6) + 1;
    diceEl.textContent = faces[value - 1];
    diceEl.classList.remove("rolling");
    rolls++; total += value;
    document.getElementById("total").textContent =
      "You rolled " + value + " — average so far: " + (total / rolls).toFixed(2);
    document.getElementById("history").textContent =
      "Rolls: " + rolls + " | Total: " + total;
  }, 300);
}
</script>
</body>
</html>
