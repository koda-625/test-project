<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reaction Time Test</title>
<style>
  body { font-family: sans-serif; text-align: center; padding: 40px; }
  #box {
    margin: 30px auto; width: 320px; height: 200px; line-height: 200px;
    font-size: 24px; color: #fff; background: #888; cursor: pointer;
    border-radius: 12px; user-select: none;
  }
  #box.waiting { background: #c0392b; }
  #box.ready   { background: #27ae60; }
  #box.done    { background: #888; }
</style>
</head>
<body>
<h1>Reaction Time Test</h1>
<p>Click the box to start. Wait for it to turn <b style="color:#27ae60">green</b>, then click as fast as you can!</p>
<div id="box" class="done">Click to start</div>
<p id="result"></p>
<script>
// Click too early and you lose the round.
let startTime = 0, timer = null, state = "idle";
const box = document.getElementById("box");
const result = document.getElementById("result");

box.addEventListener("click", () => {
  if (state === "idle") {
    // Start a round: red = wait for it...
    state = "waiting";
    box.className = "waiting";
    box.textContent = "Wait for green...";
    result.textContent = "";
    // Random delay between 1.5s and 4.5s keeps you honest.
    timer = setTimeout(() => {
      state = "ready";
      box.className = "ready";
      box.textContent = "CLICK!";
      startTime = Date.now();
    }, 1500 + Math.random() * 3000);
  } else if (state === "waiting") {
    // Clicked before green: foul.
    clearTimeout(timer);
    state = "idle";
    box.className = "done";
    box.textContent = "Too soon! Click to retry";
    result.textContent = "Foul — you jumped the gun.";
  } else if (state === "ready") {
    const ms = Date.now() - startTime;
    state = "idle";
    box.className = "done";
    box.textContent = "Click to play again";
    result.textContent = "Your reaction time: " + ms + " ms";
  }
});
</script>
</body>
</html>
