<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Counter</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  textarea { width: 100%; height: 200px; font-size: 1rem; padding: .5rem; box-sizing: border-box; }
  .stats { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem; }
  .stat { background: #f0f0f0; border-radius: 8px; padding: .75rem 1rem; text-align: center; }
  .stat b { display: block; font-size: 1.5rem; }
  button { margin-top: 1rem; padding: .5rem 1rem; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
<h1>✍️ Word Counter</h1>
<p>Paste or type your text below — stats update live.</p>
<textarea id="text" placeholder="Start typing..."></textarea>
<div class="stats">
  <div class="stat"><b id="words">0</b>words</div>
  <div class="stat"><b id="chars">0</b>characters</div>
  <div class="stat"><b id="sentences">0</b>sentences</div>
  <div class="stat"><b id="minutes">0</b>min read</div>
</div>
<button onclick="document.getElementById('text').value='';update()">Clear</button>
<script>
  const ta = document.getElementById('text');
  function update() {
    const t = ta.value;
    const words = t.trim() ? t.trim().split(/\s+/).length : 0;
    const sentences = t.trim() ? (t.match(/[.!?]+/g) || []).length : 0;
    document.getElementById('words').textContent = words;
    document.getElementById('chars').textContent = t.length;
    document.getElementById('sentences').textContent = sentences;
    // Average reading speed: ~200 words per minute
    document.getElementById('minutes').textContent = Math.ceil(words / 200);
  }
  ta.addEventListener('input', update);
  update();
</script>
</body>
</html>
