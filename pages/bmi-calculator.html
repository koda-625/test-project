<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMI Calculator</title>
<style>
  body { font-family: sans-serif; max-width: 420px; margin: 60px auto; padding: 0 20px; text-align: center; }
  input, select { padding: 8px; margin: 6px; font-size: 16px; width: 180px; }
  button { padding: 10px 24px; font-size: 16px; cursor: pointer; }
  #result { font-size: 22px; margin-top: 20px; }
  #category { font-size: 18px; color: #555; }
  .bar { height: 12px; border-radius: 6px; margin-top: 16px;
         background: linear-gradient(90deg, #4da3ff 0%, #58c96b 25%, #f7c948 55%, #ef5350 80%); }
</style>
</head>
<body>
  <h1>⚖️ BMI Calculator</h1>
  <p>Enter your height and weight to see your Body Mass Index.</p>

  <label>Units
    <select id="units">
      <option value="metric">Metric (cm / kg)</option>
      <option value="imperial">Imperial (in / lb)</option>
    </select>
  </label><br>
  <input id="height" type="number" placeholder="Height (cm)" min="1">
  <input id="weight" type="number" placeholder="Weight (kg)" min="1"><br>
  <button onclick="calc()">Calculate BMI</button>

  <div id="result"></div>
  <div id="category"></div>
  <div class="bar" id="bar" style="display:none"></div>

  <script>
    // Update placeholders when the unit system changes.
    document.getElementById('units').addEventListener('change', (e) => {
      const imperial = e.target.value === 'imperial';
      document.getElementById('height').placeholder = imperial ? 'Height (in)' : 'Height (cm)';
      document.getElementById('weight').placeholder = imperial ? 'Weight (lb)' : 'Weight (kg)';
    });

    function categoryFor(bmi) {
      if (bmi < 18.5) return 'Underweight';
      if (bmi < 25)   return 'Healthy weight';
      if (bmi < 30)   return 'Overweight';
      return 'Obese';
    }

    function calc() {
      const h = parseFloat(document.getElementById('height').value);
      const w = parseFloat(document.getElementById('weight').value);
      if (!h || !w || h <= 0 || w <= 0) {
        document.getElementById('result').textContent = 'Please enter valid numbers.';
        document.getElementById('category').textContent = '';
        return;
      }
      const imperial = document.getElementById('units').value === 'imperial';
      // BMI = kg / m^2 (metric) or 703 * lb / in^2 (imperial).
      const bmi = imperial ? (703 * w) / (h * h) : w / ((h / 100) ** 2);
      document.getElementById('result').textContent = 'Your BMI: ' + bmi.toFixed(1);
      document.getElementById('category').textContent = categoryFor(bmi);
      document.getElementById('bar').style.display = 'block';
    }
  </script>
</body>
</html>
