<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dad Joke Generator</title>
<style>
  body { font-family: system-ui, sans-serif; background: #fff7e6; color: #333;
         display: flex; flex-direction: column; align-items: center;
         justify-content: center; min-height: 100vh; margin: 0; text-align: center; }
  h1 { font-size: 2rem; margin-bottom: 0.5em; }
  #joke { font-size: 1.4rem; max-width: 560px; margin: 1em; min-height: 3.5em; }
  button { font-size: 1.1rem; padding: 0.6em 1.4em; border: none; border-radius: 8px;
           background: #ff8c42; color: white; cursor: pointer; }
  button:hover { background: #e67a2e; }
  #count { margin-top: 1.5em; color: #888; }
</style>
</head>
<body>
  <h1>😂 Dad Joke Generator</h1>
  <p id="joke">Click the button for a joke so bad, it's good.</p>
  <button onclick="newJoke()">Tell me a joke</button>
  <p id="count"></p>
  <script>
    // A small collection of classic dad jokes.
    const jokes = [
      "Why did the scarecrow win an award? Because he was outstanding in his field!",
      "I only know 25 letters of the alphabet. I don't know y.",
      "Why don't scientists trust atoms? Because they make up everything!",
      "What do you call a fish without eyes? A fsh!",
      "Why did the math book look so sad? It had too many problems.",
      "I'm reading a book about anti-gravity. It's impossible to put down!",
      "Why did the bicycle fall over? Because it was two-tired!",
      "What did the ocean say to the beach? Nothing, it just waved.",
      "Why don't skeletons fight each other? They don't have the guts.",
      "What do you call cheese that isn't yours? Nacho cheese!",
      "Why did the coffee file a police report? It got mugged!",
      "How does a penguin build its house? Igloos it together."
    ];
    let shown = 0;
    function newJoke() {
      // Pick a random joke and show it.
      const i = Math.floor(Math.random() * jokes.length);
      document.getElementById("joke").textContent = jokes[i];
      shown++;
      document.getElementById("count").textContent =
        "Jokes told: " + shown + " (groans expected: " + shown + ")";
    }
  </script>
</body>
</html>
