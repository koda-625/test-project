<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Breathing Pacer</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0;
         display: flex; flex-direction: column; align-items: center;
         justify-content: center; height: 100vh; margin: 0; }
  h1 { font-size: 1.4rem; margin-bottom: 2rem; }
  #circle { width: 120px; height: 120px; border-radius: 50%;
            background: radial-gradient(circle, #38bdf8, #0ea5e9);
            transition: transform 4s ease-in-out; display: flex;
            align-items: center; justify-content: center; }
  #label { font-size: 1.1rem; color: #0f172a; font-weight: bold; }
  #phase { margin-top: 2rem; font-size: 1.6rem; min-height: 2.5rem; }
  #count { font-size: 3rem; color: #38bdf8; }
  button { margin-top: 2rem; padding: 0.7rem 2rem; font-size: 1rem;
           border: none; border-radius: 8px; background: #38bdf8;
           color: #0f172a; cursor: pointer; font-weight: bold; }
  button:hover { background: #7dd3fc; }
</style>
</head>
<body>
  <h1>Box Breathing Pacer</h1>
  <div id="circle"><span id="label">Ready</span></div>
  <div id="phase"></div>
  <div id="count"></div>
  <button id="btn" onclick="start()">Start 4-4-4-4</button>
  <script>
    // Box breathing: inhale 4s, hold 4s, exhale 4s, hold 4s. Repeats forever.
    const phases = [
      { name: "Breathe in...",  scale: 2.0, secs: 4 },
      { name: "Hold",           scale: 2.0, secs: 4 },
      { name: "Breathe out...", scale: 1.0, secs: 4 },
      { name: "Hold",           scale: 1.0, secs: 4 },
    ];
    let running = false;
    async function start() {
      if (running) return;
      running = true;
      document.getElementById("btn").textContent = "Breathing...";
      const circle = document.getElementById("circle");
      const phaseEl = document.getElementById("phase");
      const countEl = document.getElementById("count");
      const label = document.getElementById("label");
      let cycle = 0;
      while (running) {
        for (const p of phases) {
          phaseEl.textContent = p.name;
          circle.style.transition = `transform ${p.secs}s ease-in-out`;
          circle.style.transform = `scale(${p.scale})`;
          for (let s = p.secs; s > 0; s--) {
            label.textContent = s;
            countEl.textContent = s;
            await new Promise(r => setTimeout(r, 1000));
          }
        }
        cycle++;
      }
    }
  </script>
</body>
</html>
