<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metronome</title>
<style>
  body { font-family: system-ui, sans-serif; text-align: center; padding: 40px; background: #1a1a2e; color: #eee; }
  #flash { width: 120px; height: 120px; margin: 20px auto; border-radius: 50%; background: #333; transition: background 0.05s; }
  #flash.on { background: #00e676; }
  #flash.accent { background: #ff5252; }
  input[type=number] { width: 70px; font-size: 18px; }
  button { font-size: 18px; padding: 8px 24px; cursor: pointer; margin: 10px; }
</style>
</head>
<body>
<h1>🎵 Metronome</h1>
<div id="flash"></div>
<label>BPM: <input type="number" id="bpm" value="100" min="40" max="208"></label>
<label>Beats/bar: <input type="number" id="beats" value="4" min="1" max="8"></label>
<br>
<button id="toggle">Start</button>
<script>
// Simple metronome using the Web Audio API.
let timer = null, beat = 0;
const ctx = new (window.AudioContext || window.webkitAudioContext)();
const flash = document.getElementById('flash');

function click(accent) {
  // Short oscillator blip: higher pitch on the downbeat.
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.frequency.value = accent ? 880 : 660;
  gain.gain.setValueAtTime(0.5, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.09);
}

function tick() {
  const bpm = Math.min(208, Math.max(40, +document.getElementById('bpm').value));
  const perBar = Math.min(8, Math.max(1, +document.getElementById('beats').value));
  const accent = beat % perBar === 0;
  click(accent);
  flash.className = accent ? 'accent' : 'on';
  setTimeout(() => flash.className = '', 100);
  beat++;
  timer = setTimeout(tick, 60000 / bpm);
}

document.getElementById('toggle').onclick = (e) => {
  if (timer) { clearTimeout(timer); timer = null; e.target.textContent = 'Start'; }
  else { ctx.resume(); beat = 0; tick(); e.target.textContent = 'Stop'; }
};
</script>
</body>
</html>
