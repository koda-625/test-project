<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stopwatch</title>
<style>
  /* Center the stopwatch card on a dark background */
  body { font-family: system-ui, sans-serif; background: #111827; color: #f9fafb;
         display: flex; justify-content: center; align-items: center;
         min-height: 100vh; margin: 0; }
  .card { background: #1f2937; padding: 2rem; border-radius: 1rem;
          text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.5); width: 320px; }
  /* Big monospace time display */
  #time { font-family: ui-monospace, monospace; font-size: 3rem; margin: 1rem 0; }
  button { font-size: 1rem; padding: .6rem 1.2rem; margin: .25rem; border: none;
           border-radius: .5rem; cursor: pointer; color: #fff; }
  #startBtn { background: #22c55e; }
  #stopBtn { background: #ef4444; }
  #lapBtn { background: #3b82f6; }
  #resetBtn { background: #6b7280; }
  ul { list-style: none; padding: 0; max-height: 150px; overflow-y: auto;
       text-align: left; margin-top: 1rem; }
  li { padding: .3rem .5rem; border-bottom: 1px solid #374151; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<div class="card">
  <h1>Stopwatch</h1>
  <div id="time">00:00.00</div>
  <button id="startBtn" onclick="start()">Start</button>
  <button id="stopBtn" onclick="stop()">Stop</button>
  <button id="lapBtn" onclick="lap()">Lap</button>
  <button id="resetBtn" onclick="reset()">Reset</button>
  <ul id="laps"></ul>
</div>
<script>
// Elapsed time is tracked against wall-clock so the display stays accurate
// even when the interval callback is throttled by the browser.
let startTime = 0, elapsed = 0, timerId = null, lapCount = 0;

// Format milliseconds as MM:SS.CS (minutes : seconds . centiseconds)
function fmt(ms) {
  const cs = Math.floor(ms / 10) % 100;
  const s = Math.floor(ms / 1000) % 60;
  const m = Math.floor(ms / 60000);
  return String(m).padStart(2, "0") + ":" +
         String(s).padStart(2, "0") + "." +
         String(cs).padStart(2, "0");
}

function tick() {
  document.getElementById("time").textContent = fmt(Date.now() - startTime + elapsed);
}

function start() {
  if (timerId) return;               // already running
  startTime = Date.now();
  timerId = setInterval(tick, 31);   // ~31ms gives smooth centisecond updates
}

function stop() {
  if (!timerId) return;
  elapsed += Date.now() - startTime; // bank the elapsed time so far
  clearInterval(timerId);
  timerId = null;
}

function lap() {
  if (!timerId) return;               // laps only count while running
  lapCount++;
  const li = document.createElement("li");
  li.textContent = "Lap " + lapCount + "  " + fmt(Date.now() - startTime + elapsed);
  document.getElementById("laps").appendChild(li);
}

function reset() {
  stop();
  elapsed = 0;
  lapCount = 0;
  document.getElementById("time").textContent = "00:00.00";
  document.getElementById("laps").innerHTML = "";
}
</script>
</body>
</html>
